<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pharm Flashcards</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#1b2430;--muted:#657084;--line:#dde1e8;--accent:#0f766e;--accent-t:#fff;--back:#ecfdf5;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--surface:#1b212a;--text:#e8ecf2;--muted:#9aa5b5;--line:#2e3743;--accent:#2dd4bf;--accent-t:#06201d;--back:#10302c;--danger:#f97066}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:1.4rem;margin:0 0 2px}.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label.l{display:block;font-weight:600;font-size:.88rem;margin:0 0 6px}
textarea,input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:92px;resize:vertical}select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:6px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.55}
.msg{color:var(--muted);font-size:.88rem;margin-top:10px;min-height:1.2em}.msg.err{color:var(--danger)}
.bar{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:.88rem}
.card{cursor:pointer}
.face{min-height:260px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.face.back{background:var(--back)}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}
.txt{font-size:1.15rem;white-space:pre-wrap}.hint{font-size:.78rem;color:var(--muted);margin-top:14px}
.nav{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hide{display:none}.empty{text-align:center;color:var(--muted);padding:28px 8px}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<main>
<header><div><h1>USMLE Flashcards</h1><p class="sub">Clean, single-concept cards for USMLE Step 1 and Step 2 CK.</p></div>
<button class="btn" id="cfg" aria-label="Settings">⚙ Settings</button></header>

<section class="panel hide" id="settings">
<label class="l" for="key">Anthropic API key</label>
<input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">
<div style="height:10px"></div>
<label class="l" for="model">Model</label>
<input id="model" placeholder="claude-sonnet-5-5">
<p class="note">Stored only in this browser on this device and sent only to api.anthropic.com. Use a key with a spending limit.</p>
<div class="row" style="margin-top:10px"><button class="btn pri" id="saveCfg">Save</button></div>
</section>

<section class="panel">
<label class="l" for="subj">Subject</label><select id="subj" style="width:100%"><optgroup label="Basic sciences"><option>Anatomy</option><option>Histology and cell biology</option><option>Embryology</option><option>Physiology</option><option>Biochemistry</option><option>Genetics</option><option>Microbiology</option><option>Immunology</option><option>Pathology</option><option selected>Pharmacology</option><option>Behavioral science</option><option>Biostatistics and epidemiology</option><option>Ethics and law</option></optgroup><optgroup label="Clinical sciences"><option>Internal medicine</option><option>Surgery</option><option>Pediatrics</option><option>Obstetrics and gynecology</option><option>Psychiatry</option><option>Neurology</option><option>Emergency medicine</option><option>Community and preventive medicine</option></optgroup></select><div style="height:12px"></div><label class="l" for="sec">Section</label><select id="sec" style="width:100%"></select><div style="height:12px"></div><label class="l" for="top">Topic</label><select id="top" style="width:100%"></select><div style="height:12px"></div><label class="l" for="src">Extra topics or pasted notes (optional)</label>
<textarea id="src" placeholder="e.g. Warfarin, Heparin, DOACs"></textarea><div style="height:12px"></div><label class="l">Focus areas</label><div class="chips" id="chips"></div>
<div class="row"><label for="n" style="font-size:.88rem">Cards per topic</label>
<select id="n"><option>3</option><option selected>5</option><option>8</option><option>12</option></select>
<button class="btn pri" id="gen">Generate cards</button></div>
<div class="msg" id="msg"></div>
</section>

<section class="panel hide" id="deck">
<div class="bar"><span id="pos"></span><span id="tagline"></span></div>
<div class="card" id="card" tabindex="0" role="button" aria-label="Flip card"><div class="face" id="face"></div></div>
<div class="nav"><button class="btn" id="prev">← Prev</button><button class="btn" id="flip">Flip</button><button class="btn" id="next">Next →</button></div>
<div class="nav"><button class="btn" id="shuf">Shuffle</button><button class="btn" id="del">Delete card</button><button class="btn" id="exp">Export for Anki</button><button class="btn" id="clr">Clear deck</button></div>
</section>
<div class="empty" id="empty">No cards yet. Choose a topic above and generate a deck.</div>
</main>

function fillSec(){var s=$("sec");s.innerHTML="";s.add(new Option("Choose a section",""));Object.keys(CURR[subject]||{}).forEach(function(k){s.add(new Option(k,k))});fillTop()}
function fillTop(){var t=$("top"),sec=$("sec").value;t.innerHTML="";t.disabled=!sec;t.add(new Option(sec?"All topics in this section":"Choose a section first",""));if(sec)CURR[subject][sec].forEach(function(k){t.add(new Option(k,k))})}
$("sec").onchange=fillTop;
$("subj").onchange=function(){setSubject(this.value)};
function msg(t,err){var m=$("msg");m.textContent=t||"";m.className="msg"+(err?" err":"")}
$("cfg").onclick=function(){$("settings").classList.toggle("hide");$("key").value=ls("pharm_key")||"";$("model").value=ls("pharm_model")||""};
$("saveCfg").onclick=function(){ls("pharm_key",$("key").value.trim());ls("pharm_model",$("model").value.trim());$("settings").classList.add("hide");msg("Settings saved.")};
function render(){
 var has=cards.length>0;$("deck").classList.toggle("hide",!has);$("empty").classList.toggle("hide",has);if(!has)return;
 if(i>=cards.length)i=cards.length-1;var c=cards[i];
 $("pos").textContent="Card "+(i+1)+" of "+cards.length;$("tagline").textContent=c.drug||"";
 var f=$("face");f.className="face"+(showBack?" back":"");f.innerHTML="";
 var t=document.createElement("div");t.className="tag";t.textContent=(showBack?"Answer":"Question")+(c.type?" · "+c.type:"");
 var x=document.createElement("div");x.className="txt";x.textContent=showBack?c.back:c.front;
 var h=document.createElement("div");h.className="hint";h.textContent="Tap card to flip";
 f.appendChild(t);f.appendChild(x);f.appendChild(h)}
function flip(){showBack=!showBack;render()}
function go(d){i=(i+d+cards.length)%cards.length;showBack=false;render()}
$("card").onclick=flip;$("flip").onclick=flip;
$("card").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
$("prev").onclick=function(){go(-1)};$("next").onclick=function(){go(1)};
$("shuf").onclick=function(){for(var a=cards.length-1;a>0;a--){var j=Math.floor(Math.random()*(a+1));var t=cards[a];cards[a]=cards[j];cards[j]=t}i=0;showBack=false;save();render()};
$("del").onclick=function(){cards.splice(i,1);showBack=false;save();render()};
$("clr").onclick=function(){if(confirm("Delete all cards in this deck?")){cards=[];i=0;save();render()}};
function esc(s){return '"'+String(s).replace(/"/g,'""').replace(/\r?\n/g,"<br>")+'"'}
$("exp").onclick=function(){

 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([tsv],{type:"text/tab-separated-values"}));
 a.download="pharmacology-flashcards.tsv";document.body.appendChild(a);a.click();a.remove()};
var SYS="You write USMLE-quality flashcards in the subject named in the input (any medical school subject). Rules: each card tests exactly ONE fact; the front is a short, specific question (no “list all”); the back is the answer in at most 20 words, no filler; prefer high-yield, board-tested facts (classic mechanisms, signature adverse effects, buzzword associations, key contraindications, important interactions, CYP effects, antidotes); be accurate and use standard US generic names; never invent facts. For biochemistry, favor rate-limiting enzymes, enzyme deficiencies and their classic presentations, cofactors and vitamins, regulation, inheritance patterns, and key lab findings; For clinical subjects, favor classic presentations, best next step in diagnosis or management, first-line treatments, and key complications, in USMLE vignette style where useful. Outside pharmacology, the drug field holds the topic (structure, organism, disease, or pathway). Return ONLY a JSON array, no markdown, of objects: {\"drug\":string,\"type\":string,\"front\":string,\"back\":string}. “type” must be one of the requested focus areas.";
$("gen").onclick=async function(){
 var topic=$("src").value.trim(),areas=FOCUS.filter(function(f){return on[f]}),key=ls("pharm_key");
 if(!key){$("settings").classList.remove("hide");msg("Add your Anthropic API key in Settings first.",true);return}
 var sec=$("sec").value,tp=$("top").value;
 if(!topic&&!sec){msg("Choose a section or enter a topic.",true);return}
 var path=sec?subject+" > "+sec+" > "+(tp||"all topics ("+CURR[subject][sec].join("; ")+")"):"";
 var cnt=sec&&!tp?"About "+Math.min(+$("n").value*4,40)+" cards in total, spread across the section's topics and the focus areas.":"About "+$("n").value+" cards per topic, spread across the focus areas.";
 if(!areas.length){msg("Pick at least one focus area.",true);return}
 if(!navigator.onLine){msg("You are offline. Study your saved deck, or reconnect to generate.",true);return}
 $("gen").disabled=true;msg("Generating cards…");
 try{
  var prompt="Subject: "+subject+(path?"\nCurriculum topic: "+path:"")+(topic?"\n\nAdditional topics or notes:\n"+topic:"")+"\n\nFocus areas: "+areas.join(", ")+"\n"+cnt+" If a class is given, cover its key member drugs and class-wide facts; for a pathway or disease group, cover its key enzymes, regulation, and classic presentations. If notes are pasted, build cards only from facts in them.";
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
   body:JSON.stringify({model:ls("pharm_model")||"claude-sonnet-5-5",max_tokens:8000,system:SYS,messages:[{role:"user",content:prompt}]})});
  var d=await r.json();if(!r.ok)throw new Error(d&&d.error&&d.error.message||("HTTP "+r.status));
  var txt=(d.content||[]).map(function(b){return b.text||""}).join("").replace(/```json|```/g,"").trim();
  var out=JSON.parse(txt.slice(txt.indexOf("["),txt.lastIndexOf("]")+1));
  var fresh=out.filter(function(c){return c&&c.front&&c.back}).map(function(c){return{drug:String(c.drug||""),type:String(c.type||""),front:String(c.front),back:String(c.back)}});
  if(!fresh.length)throw new Error("No cards returned.");
  cards=cards.concat(fresh);i=cards.length-fresh.length;showBack=false;save();render();
  msg(fresh.length+" cards added. Verify against a trusted source before relying on them.");
 }catch(e){msg("Generation failed: "+(e.message||"unknown error"),true)}finally{$("gen").disabled=false}};
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
setSubject($("subj").value);
render();
})();
